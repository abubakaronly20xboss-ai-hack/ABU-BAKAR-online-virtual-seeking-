 function makeDraggable(element, handle) {
   let startX = 0, startY = 0;
   handle.addEventListener('pointerdown', (e) => {
     if (e.target.closest("button, input, a")) return;
     const rect = element.getBoundingClientRect();
     startX = e.clientX - rect.left;
     startY = e.clientY - rect.top;
     element.classList.add("dragging");
     handle.setPointerCapture(e.pointerId);
   });
   handle.addEventListener('pointermove', (e) => {
     if (!element.classList.contains("dragging")) return;
     const x = e.clientX - startX;
     const y = e.clientY - startY;
     element.style.left = x + 'px';
     element.style.top = y + 'px';
     element.style.transform = 'none';
   });
   handle.addEventListener('pointerup', (e) => {
     element.classList.remove("dragging");
     try { handle.releasePointerCapture(e.pointerId); } catch(err){}
   });
 }

         addHistoryItem({
           period: oldPeriod.slice(-5),
           predSide: predObj.side,
           predNum: predObj.number,
           actualNum: num,
           status: isJackpot ? "JACKPOT" : (isWin ? "WIN" : "LOSS")
         });
         return true;
       }
     }
   } catch (e) {}
   return false;
 }

 function addHistoryItem(item) {
   savedHistory.unshift(item);
   if (savedHistory.length > 6) savedHistory.pop();
   let statusClass = item.status === "LOSS" ? "loss" : (item.status === "JACKPOT" ? "jackpot" : "win");
   const div = document.createElement('div');
   div.className = 'hist-item';
   div.innerHTML = `
     <span class="hist-period">#${item.period}</span>
     <span class="hist-pred">${item.predSide} (${item.predNum})</span>
     <span class="hist-result ${statusClass}">${item.status} (${item.actualNum})</span>
   `;
   histListContainer.insertBefore(div, histListContainer.firstChild);
   if(histListContainer.children.length > 6) {
     histListContainer.removeChild(histListContainer.lastChild);
   }
 }

 async function fetchInitialHistory() {
   try {
     let res = await fetch(getApiUrl());
     let data = await res.json();
     let listData = data?.data?.list || data?.data || data;
     if (Array.isArray(listData) && listData.length > 0) {
       rawApiHistoryList = listData;
       const latestIssue = listData[0].issueNumber || listData[0].issue;
       const nextIssueId = (BigInt(latestIssue) + 1n).toString();
       currentPeriod = nextIssueId;
       currentPredData = masterPredict(nextIssueId);
       renderPredictionScreen(currentPredData);
     }
   } catch(e) {}
 }

 function renderPredictionScreen(pred) {
   const numberImgUrl = NUMBER_IMAGES[pred.number];
   let recentBallsHTML = '';
   if (rawApiHistoryList.length >= 3) {
     for(let i=2; i>=0; i--) {
       let n = parseInt(rawApiHistoryList[i].number || rawApiHistoryList[i].openNum || rawApiHistoryList[i].result, 10);
       if (isNaN(n)) n = 0;
       let logoUrl = NUMBER_IMAGES[n];
       recentBallsHTML += `<img src="${logoUrl}" alt="${n}" class="mini-ball-logo">`;
     }
   } else {
     recentBallsHTML = `<img src="${NUMBER_IMAGES[0]}" class="mini-ball-logo"><img src="${NUMBER_IMAGES[5]}" class="mini-ball-logo"><img src="${NUMBER_IMAGES[2]}" class="mini-ball-logo">`;
   }

   let sideClass = pred.side === "BIG" ? "big-btn-style" : "small-btn-style";

   panelContainer.innerHTML = `
     <div class="signal-outer" id="main-panel-box">
       <div class="bracket-tl"></div><div class="bracket-tr"></div><div class="bracket-bl"></div><div class="bracket-br"></div>
       <div class="signal-header" id="drag-header">
         <div>
           <div class="title-main">ABU BAKAR ONLY BOSS</div>
           <div class="game-mode">VIP SIGNAL</div>
         </div>
         <button id="closeBtn" style="background:none; border:none; color:var(--cyan-border); font-weight:900; cursor:pointer; font-size:15px;">✕</button>
       </div>
       <div class="recent-balls-row">${recentBallsHTML}</div>
       <div class="period-badge">PERIOD : ${pred.period.slice(-4)}</div>
       <div class="pred-display-box">
         <div class="bracket-tl"></div><div class="bracket-tr"></div><div class="bracket-bl"></div><div class="bracket-br"></div>
         <div class="big-small-btn ${sideClass}">${pred.side}</div>
         <div class="num-circle-box"><img src="${numberImgUrl}" alt="${pred.number}"></div>
       </div>
       <div class="action-buttons-row">
         <button class="action-btn btn-history" id="historyBtn">HISTORY</button>
         <button class="action-btn btn-hide" id="hidePanelBtn">HIDE</button>
       </div>
     </div>
   `; 

   makeDraggable(mainWrapper, document.getElementById('main-panel-box'));

   document.getElementById('closeBtn').addEventListener('click', () => {
     mainWrapper.style.display = "none";
     historyWrapper.style.display = "none";
     miniOrb.style.display = "flex";
   });

   document.getElementById('historyBtn').addEventListener('click', () => {
     historyWrapper.style.display = historyWrapper.style.display === "flex" ? "none" : "flex";
   });

   document.getElementById('hidePanelBtn').addEventListener('click', () => {
     mainWrapper.style.display = "none";
     historyWrapper.style.display = "none";
     miniOrb.style.display = "flex";
   });
 }

 let pendingNextPeriod = null;
 async function tick() {
   try {
     let res = await fetch(getApiUrl());
     let data = await res.json();
     let listData = data?.data?.list || data?.data || data;
     if (Array.isArray(listData) && listData.length > 0) {
       rawApiHistoryList = listData;
       const latestIssue = listData[0].issueNumber || listData[0].issue;
       const nextIssueId = (BigInt(latestIssue) + 1n).toString();
       if (nextIssueId !== currentPeriod) {
         if (pendingNextPeriod !== nextIssueId) {
           pendingNextPeriod = nextIssueId;
           setTimeout(() => {
             if (pendingNextPeriod === nextIssueId && nextIssueId !== currentPeriod) {
               if (currentPeriod !== "---" && currentPredData !== null) {
                 fetchActualResult(currentPeriod, currentPredData);
               }
               currentPeriod = nextIssueId;
               currentPredData = masterPredict(nextIssueId);
               renderPredictionScreen(currentPredData);
             }
           }, 3000);
         }
       }
     }
   } catch(s) {}
 }

 renderAuthScreen();
})();
</script>
